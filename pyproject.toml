[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "discretelog-lr8"
version = "1.0.0"
description = "ЛР8: дискретний логарифм і порівняння алгоритмів"
requires-python = ">=3.10"
authors = [{name = "Dmytro Handziuk"}]
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
